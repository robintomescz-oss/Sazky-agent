name: Daily Betting Ticket

on:
  schedule:
    # 09:00 UTC = 10:00 SEČ (středoevropský čas)
    - cron: '0 9 * * *'
  workflow_dispatch: # Ponechá tlačítko pro ruční spuštění přímo na webu

permissions:
  contents: write

jobs:
  run-betting-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Stáhnout repozitář
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Nainstalovat závislosti
        run: |
          pip install requests python-dotenv openai json-repair


      - name: Spustit sázkového agenta
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python agent.py

      - name: Zapsat novou historii do repozitáře
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets_history.json
          git commit -m "Auto: aktualizace historie tiketu [skip ci]" || exit 0
          git push
