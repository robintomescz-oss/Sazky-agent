name: Evening Results Evaluation

on:
  schedule:
    # 22:00 UTC odpovídá 23:00 SEČ v ČR
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests python-dotenv

      - name: Run evaluation script
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python evaluate_results.py

      - name: Commit and push updated ticket history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tickets_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-evaluate ticket results and progression" && git push)
