name: Live Match Tracker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track-live:
    runs-on: ubuntu-latest

    steps:
      - name: Stažení repozitáře
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Nastavení Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalace knihoven
        run: pip install requests python-dotenv

      - name: Kontrola live skóre a gólů
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python live_tracker.py

      - name: Uložení live stavu do historie
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add tickets_history.json
          if ! git diff --staged --quiet; then
            git pull --rebase origin main
            git commit -m "Live match update"
            git push
          fi
